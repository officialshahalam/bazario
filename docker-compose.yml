version: "3.8"

services:
  # Redis for caching
  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    networks:
      - bazario-net

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    networks:
      - bazario-net

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - bazario-net

  kafka-service:
    image: aalam855/bazario-kafka-service:latest
    env_file:
      - .env
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - bazario-net

  # Api-Gateway
  api-gateway:
    image: aalam855/bazario-api-gateway:latest
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - kafka-service
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bazario-net

  auth-service:
    image: aalam855/bazario-auth-service:latest
    ports:
      - "4001:4001"
    env_file:
      - .env
    depends_on:
      - kafka-service
      - redis
    restart: unless-stopped
